[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Prediccion de demanda horaria por estacion del sistema MiBici (Guadalajara) aplicando MLOps"
authors = [
  { name = "Equipo 5" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true


[tool.ruff.lint.flake8-bugbear]
# typer.Option y typer.Argument son el patrón estándar de Typer en argumentos
extend-immutable-calls = ["typer.Option", "typer.Argument"]
