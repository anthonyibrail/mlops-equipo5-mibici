name: CD

# PREREQUISITO: este workflow requiere que exista un Dockerfile en la raiz.
# Mientras no este disponible, el unico disparo activo es manual (workflow_dispatch).
#
# Para activar el disparo automatico una vez que el Dockerfile este listo:
#   1. Descomenta los bloques "push" y "release" de abajo.
#   2. Configura los secrets DOCKER_USERNAME y DOCKER_TOKEN en:
#      GitHub -> Settings -> Secrets and variables -> Actions

on:
  # Disparo manual para pruebas antes de que Docker este listo.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la imagen Docker (ej. 1.0.0)"
        required: false
        default: "latest"

  # -- Descomentar cuando el Dockerfile exista ---------------------------------
  # push:
  #   branches: [main]
  # release:
  #   types: [published]
  # ---------------------------------------------------------------------------

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verifica que el Dockerfile existe antes de continuar.
      - name: Check Dockerfile exists
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "ERROR: Dockerfile not found. Create it before enabling CD."
            exit 1
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ml-service
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de capas para builds mas rapidos.
          cache-from: type=gha
          cache-to: type=gha,mode=max
