# Configuracion central del proyecto (Fase 2).
# Ningun modulo debe fijar en el codigo los valores que aparecen aqui:
# se leen con mibici.config.load_params().

seed: 42

datos:
  viajes: data/interim/trips_v1.parquet
  features: data/processed/demand_features_v3.parquet

# --- Definicion del problema -------------------------------------------------
# Decision que apoya el modelo: el plan nocturno de redistribucion de bicicletas.
# A las 00:00 del dia D se pronostican las 24 horas de D para cada estacion.
problema:
  # Se pronostican salidas y llegadas por estacion y hora; con ambas se obtiene
  # el balance neto (salidas - llegadas), que indica si una estacion se vacia o se llena.
  objetivos: [salidas, llegadas]
  hora_pronostico: 0
  horizonte_horas: 24
  # Al pronosticar a las 00:00 solo se conocen los datos de dias anteriores.
  # Por eso ninguna feature puede usar un rezago menor a 24 h
  # (por ejemplo, demanda_lag_1h no existe en el momento de la prediccion).
  rezago_minimo_horas: 24
  horas_pico: [7, 8, 9, 17, 18, 19]

# --- Validacion con ventana movil (walk-forward) -----------------------------
# Se entrena con los meses anteriores a un corte, se evalua en el mes siguiente,
# se avanza el corte un mes y se repite. Se reporta el promedio de los cortes.
validacion:
  columna_tiempo: hora_inicio
  primer_mes_prueba: "2026-04"
  n_cortes: 6               # meses de prueba: 2026-04 ... 2026-09
  meses_prueba: 1
  meses_entrenamiento: 12   # ventana movil de 12 meses; null = ventana creciente

# --- Lineas base ---------------------------------------------------------------
# Todo modelo debe compararse contra ambas con el mismo esquema de validacion.
lineas_base:
  # Ingenuo estacional: misma estacion y hora de la semana anterior.
  columna_estacional: "{objetivo}_lag_168h"
  # Promedio historico del periodo de entrenamiento por estacion, dia y hora.
  llaves_promedio: [estacion_id, dia_semana, hora]

# --- Modelos -------------------------------------------------------------------
# Propuesta inicial; el Data Scientist ajusta el espacio de busqueda.
modelos:
  hist_gbr:
    fijos:
      loss: poisson          # la demanda es un conteo no negativo
      max_iter: 300
      learning_rate: 0.05    # tasa de aprendizaje conservadora para mayor estabilidad
      max_leaf_nodes: 31     # limita la complejidad de cada arbol
      min_samples_leaf: 100  # requiere al menos 100 muestras por hoja
      l2_regularization: 1.0 # penalizacion L2 fuerte para evitar extrapolacion con Poisson
    busqueda:
      n_iter: 10
      espacio:
        learning_rate: [0.03, 0.05, 0.1]
        max_leaf_nodes: [31, 63, 127]
        min_samples_leaf: [20, 50, 100]
        l2_regularization: [0.0, 0.1, 1.0]

mlflow:
  experimento_modelos: mibici-modelos
  modelo_registrado: mibici-demanda

# --- Promocion en el Model Registry -------------------------------------------
# register.py registra cada modelo con el alias "candidate"; promote.py le asigna
# "champion" solo si su MAE de los seis cortes es menor que el de la linea base en
# TODOS los criterios. predict.py carga siempre la version "champion".
promocion:
  alias_candidato: candidate
  alias_produccion: champion
  linea_base_referencia: promedio_historico
  criterios: [salidas, llegadas, balance]

# --- Monitoreo de data drift (Entrega final) -----------------------------------
# drift.py toma como referencia el primer mes posterior al entrenamiento
# (validacion.primer_mes_prueba), genera escenarios sinteticos a partir de ella y
# compara datos y desempeno contra esa referencia. Ver mibici/modeling/drift.py.
drift:
  experimento: mibici-monitoreo
  # Columnas de entrada vigiladas con PSI (no requieren conocer la demanda real)
  # Las de calendario (hora, dia, mes) no se vigilan: cambian cada mes por diseño.
  columnas_monitoreo:
    [salidas_lag_24h, salidas_lag_48h, salidas_lag_168h, llegadas_lag_24h,
     llegadas_lag_168h, media_7d, salidas_sistema_lag_24h]
  bins_psi: 10
  umbrales:
    psi_aviso: 0.10          # PSI: < 0.10 estable, 0.10-0.25 cambio moderado
    psi_alerta: 0.25         # > 0.25 cambio significativo
    faltantes_alerta: 0.05   # aumento en la fraccion de nulos de una columna
    sesgo_aviso: 0.10        # cambio en el sesgo (pronostico total / demanda total - 1)
    sesgo_alerta: 0.20
    mae_aviso: 1.10          # MAE del escenario / MAE de referencia
    mae_alerta: 1.25
    margen_linea_base: 0.02  # alerta si el MAE supera al de la linea base en mas de 2 %
  # Escenarios sinteticos (tipos: demanda, features, faltantes, estacional)
  escenarios:
    sin_drift:               # control: debe quedar en OK (sin falsas alarmas)
      tipo: demanda
      factor: 1.0
    aumento_demanda:         # la demanda real sube 30 % y las features aun no lo reflejan
      tipo: demanda
      factor: 1.3
    error_pipeline_conteos:  # un error en el pipeline duplica los conteos historicos
      tipo: features
      columnas: [salidas_lag_24h, salidas_lag_48h, salidas_lag_168h,
                 llegadas_lag_24h, llegadas_lag_168h, media_7d]
      factor: 2.0
    feature_faltante:        # se pierde la mitad de dos features agregadas
      tipo: faltantes
      columnas: [media_7d, salidas_sistema_lag_24h]
      fraccion: 0.5
    temporada_vacaciones:    # diciembre: la demanda baja 40 % respecto de abril
      tipo: estacional
      factor: 0.6
      mes: 12
